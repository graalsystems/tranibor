# At night: full e2e, conformance of every backend, evals, Temporal replay, scans.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          config: dev/kind.yaml
          cluster_name: choregos
      - name: CNI that enforces the NetworkPolicy
        # `dev/kind.yaml` disables the default CNI: kindnet accepts the policies and
        # lets the traffic through, which would turn a sandbox that holds nothing green.
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s
      - run: uv sync --frozen
      - name: milestone scenarios on kind
        run: uv run pytest tests/e2e -m e2e -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: e2e-report, path: tests/e2e/report, if-no-files-found: ignore }

  cluster:
    name: What only holds on a real cluster
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          config: dev/kind.yaml
          cluster_name: choregos
      - name: Calico, CloudNativePG, Argo Rollouts
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s
          kubectl apply --server-side -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.25/releases/cnpg-1.25.1.yaml
          kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=300s
          kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/install.yaml
          kubectl -n argo-rollouts rollout status deploy/argo-rollouts --timeout=300s
      - run: uv sync --frozen
      - name: API image (the platform stack needs it) and the outpost daemon's (S65-19)
        run: |
          docker build -f docker/api.Dockerfile --target api -t choregos-api:dev .
          docker build -f docker/outpost.Dockerfile -t choregos-outpost:dev .
          kind load docker-image choregos-api:dev choregos-outpost:dev --name choregos
      - name: egress, restore, manifests, platform, canary, node loss
        env:
          TRANIBOR_CLUSTER_CONTEXT: kind-choregos
        run: uv run pytest tests/cluster -m cluster -q
      - name: cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get events -A --sort-by=.lastTimestamp | tail -40

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --frozen
      - name: all ACP backends
        run: uv run pytest tests/conformance -m conformance -q
      - name: conformance report
        run: uv run python -m tests.conformance.report --output conformance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: conformance, path: conformance.json, if-no-files-found: ignore }

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --frozen
      - name: playbook evals (blocking threshold)
        run: uv run python -m tranibor_playbooks.evals.runner --all --json evals.json
      - name: evals of the catalogue's agents (S33-06)
        run: uv run python -m tranibor_core.agent_catalogue.evals --all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: evals, path: evals.json, if-no-files-found: ignore }

  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --frozen
      - name: replay of the archived Temporal histories
        run: uv run pytest tests/replay -q

  core-without-plugins:
    # ADR 0181 round D: the core's whole suite with the first-party plugins' extensions uninstalled, less
    # the files that still need them (`tests/core_alone/need_the_plugins.txt`, a ceiling that only falls:
    # `tests/core_alone/test_need_the_plugins_list.py`). The `ci` workflow's job of the same name runs the
    # boundary on every Python PR.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TRANIBOR_TEST_CORE_ALONE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --frozen --no-install-package tranibor-software-delivery --no-install-package tranibor-investment-research
      - name: the core's suite, without the plugins' extensions
        run: |
          mapfile -t ignored < <(grep -v '^#' tests/core_alone/need_the_plugins.txt | grep . | sed 's/^/--ignore=/')
          uv run --no-sync pytest -n 4 -q -m "not slow" packages apps tests "${ignored[@]}"

  live:
    # The adapters against the REAL services (LiteLLM, GitLab, Jira, Ecphoria, ACA, Rovo, ServiceNow). A
    # service named in TRANIBOR_LIVE_REQUIRED FAILS the job when one of its secrets is missing
    # (tests/live/conftest.py): a vanished secret must not leave the night green. The other
    # services, and the optional companions of a required one (the realtime model), are
    # skipped when their secret is missing — and say so — rather than an empty green dot.
    # Forks have no secrets: the job only runs on the repository itself.
    if: github.repository == 'graalsystems/tranibor'
    runs-on: ubuntu-latest
    env:
      # The services the night must cover, from the repository variable of the same name (for
      # example `litellm,gitlab,jira`). The owner adds a service once its secrets are set, never
      # before: a service listed without its secrets turns every night red. Unset, every service
      # skips and says so, as before.
      TRANIBOR_LIVE_REQUIRED: ${{ vars.TRANIBOR_LIVE_REQUIRED }}
      TRANIBOR_LIVE_LITELLM_URL: ${{ secrets.TRANIBOR_LIVE_LITELLM_URL }}
      TRANIBOR_LIVE_LITELLM_KEY: ${{ secrets.TRANIBOR_LIVE_LITELLM_KEY }}
      TRANIBOR_LIVE_GITLAB_TOKEN: ${{ secrets.TRANIBOR_LIVE_GITLAB_TOKEN }}
      TRANIBOR_LIVE_GITLAB_PROJECT: ${{ secrets.TRANIBOR_LIVE_GITLAB_PROJECT }}
      TRANIBOR_LIVE_JIRA_URL: ${{ secrets.TRANIBOR_LIVE_JIRA_URL }}
      TRANIBOR_LIVE_JIRA_EMAIL: ${{ secrets.TRANIBOR_LIVE_JIRA_EMAIL }}
      TRANIBOR_LIVE_JIRA_TOKEN: ${{ secrets.TRANIBOR_LIVE_JIRA_TOKEN }}
      TRANIBOR_LIVE_JIRA_PROJECT: ${{ secrets.TRANIBOR_LIVE_JIRA_PROJECT }}
      # Not required: these tests skip, saying so, until the secrets exist.
      TRANIBOR_LIVE_AZURE_TOKEN: ${{ secrets.TRANIBOR_LIVE_AZURE_TOKEN }}
      TRANIBOR_LIVE_AZURE_SUBSCRIPTION: ${{ secrets.TRANIBOR_LIVE_AZURE_SUBSCRIPTION }}
      TRANIBOR_LIVE_AZURE_RG: ${{ secrets.TRANIBOR_LIVE_AZURE_RG }}
      TRANIBOR_LIVE_AZURE_ENV_ID: ${{ secrets.TRANIBOR_LIVE_AZURE_ENV_ID }}
      TRANIBOR_LIVE_ECPHORIA_URL: ${{ secrets.TRANIBOR_LIVE_ECPHORIA_URL }}
      TRANIBOR_LIVE_ECPHORIA_TOKEN: ${{ secrets.TRANIBOR_LIVE_ECPHORIA_TOKEN }}
      TRANIBOR_LIVE_ECPHORIA_TENANT: ${{ secrets.TRANIBOR_LIVE_ECPHORIA_TENANT }}
      TRANIBOR_LIVE_ROVO_ACCESS_TOKEN: ${{ secrets.TRANIBOR_LIVE_ROVO_ACCESS_TOKEN }}
      TRANIBOR_LIVE_REALTIME_MODEL: ${{ secrets.TRANIBOR_LIVE_REALTIME_MODEL }}
      # The ServiceNow plugin's MCP server, run against a real instance (S80-20,
      # tests/live/test_servicenow_live.py).
      TRANIBOR_LIVE_SERVICENOW_MCP_URL: ${{ secrets.TRANIBOR_LIVE_SERVICENOW_MCP_URL }}
      TRANIBOR_LIVE_SERVICENOW_MCP_TOKEN: ${{ secrets.TRANIBOR_LIVE_SERVICENOW_MCP_TOKEN }}
      TRANIBOR_LIVE_SERVICENOW_WEBHOOK_SECRET: ${{ secrets.TRANIBOR_LIVE_SERVICENOW_WEBHOOK_SECRET }}
      # An organisation's MCP gateway (ADR 0105). Not in TRANIBOR_LIVE_REQUIRED: an unset URL skips,
      # but a URL that is set and unreachable (or without its server or token) fails.
      TRANIBOR_LIVE_MCP_GATEWAY_URL: ${{ secrets.TRANIBOR_LIVE_MCP_GATEWAY_URL }}
      TRANIBOR_LIVE_MCP_GATEWAY_SERVER: ${{ secrets.TRANIBOR_LIVE_MCP_GATEWAY_SERVER }}
      TRANIBOR_LIVE_MCP_GATEWAY_TOKEN: ${{ secrets.TRANIBOR_LIVE_MCP_GATEWAY_TOKEN }}
      TRANIBOR_LIVE_MCP_GATEWAY_ROUTING: ${{ secrets.TRANIBOR_LIVE_MCP_GATEWAY_ROUTING }}
      TRANIBOR_LIVE_MCP_GATEWAY_SERVER_HEADER: ${{ secrets.TRANIBOR_LIVE_MCP_GATEWAY_SERVER_HEADER }}
      TRANIBOR_LIVE_MCP_GATEWAY_AUTH_HEADER: ${{ secrets.TRANIBOR_LIVE_MCP_GATEWAY_AUTH_HEADER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --frozen
      - name: adapters against the real services (a required service fails without its secrets)
        run: uv run pytest tests/live -q -m live -rs

  purchasing-live:
    name: purchasing server against Odoo ${{ matrix.odoo }}
    # The purchasing MCP server's profile against a REAL Odoo (S85-14). Odoo and its database are
    # containers this job starts, so nothing here may skip: a service that does not come up fails the
    # job (a bounded wait, then `exit 1`), and tests/live/purchasing never calls skip
    # (tests/ci/test_purchasing_live_job.py). No secret: every key is minted in the job. Runbook:
    # docs/runbooks/purchasing-live.md.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Odoo 19 keeps a registration number on a partner; Odoo 20 does not (`not_supported`).
          - odoo: "19.0"
            image: odoo:19.0@sha256:03a47921f9eef2c225ded1167fe7828465d2b3177883f30d173bb1c3c792949b
            registry: "true"
          - odoo: "20.0"
            image: odoo:20.0@sha256:c7352c766b245b3c0e5c7b7a57e7660dde3265872be9566870d44bdb974f44cf
            registry: "false"
    env:
      # The image the agents repository published with procurement 0.2.1 (publish.yml, graalsystems/tranibor-agents#26);
      # its digest, read from the registry, is the one tested (tests/architecture/test_supply_chain_pinned.py).
      PURCHASING_IMAGE: ghcr.io/graalsystems/tranibor-agents/purchasing-mcp:0.2.1@sha256:7f30dcf159f3b8d4a46dedb9f290c3205c7e1e90f7e7c7970cb48a183513588e
      # The TLS terminator (the server only talks to https): its image is pinned too.
      TLS_IMAGE: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
      ODOO_DATABASE: ci
    services:
      db:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      odoo:
        image: ${{ matrix.image }}
        env:
          HOST: db
          USER: odoo
          PASSWORD: odoo
        ports:
          - 8069:8069
        options: --label purchasing-live=odoo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --frozen
      - name: wait for Odoo (bounded; a service that does not come up fails the job)
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8069/web/health > /dev/null; then echo "odoo is up after $attempt tries"; exit 0; fi
            sleep 5
          done
          echo "::error::Odoo did not answer /web/health in 5 minutes"
          docker ps -a
          docker logs "$(docker ps -aq --filter label=purchasing-live=odoo)" 2>&1 | tail -80
          exit 1
      - name: initialise the database (Contacts, Purchase, Purchase Agreements) and mint the API keys
        run: |
          set -euo pipefail
          odoo_container="$(docker ps -q --filter label=purchasing-live=odoo)"
          test -n "$odoo_container" || { echo "::error::no Odoo container"; exit 1; }
          flags="--db_host=db --db_user=odoo --db_password=odoo --no-http"
          timeout 1200 docker exec "$odoo_container" odoo -d "$ODOO_DATABASE" $flags \
            -i base,contacts,purchase,purchase_requisition --without-demo=all --stop-after-init
          timeout 300 docker exec -i "$odoo_container" odoo shell -d "$ODOO_DATABASE" $flags \
            < tests/live/purchasing/odoo_keys.py | grep '^PURCHASING_LIVE_' > keys.env
          for name in PURCHASING_LIVE_ODOO_ADMIN_KEY PURCHASING_LIVE_INTEGRATION_KEY; do
            value="$(grep "^$name=" keys.env | cut -d= -f2-)"
            test -n "$value" || { echo "::error::$name was not minted"; exit 1; }
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          rm keys.env
      - name: TLS in front of Odoo (the server refuses a plain-http base URL)
        run: |
          set -euo pipefail
          mkdir certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" -addext "basicConstraints=critical,CA:TRUE" \
            -keyout certs/server.key -out certs/server.pem
          chmod -R a+rX certs
          docker run -d --name tls --network host \
            -v "$PWD/tests/live/purchasing/nginx.conf:/etc/nginx/nginx.conf:ro" -v "$PWD/certs:/certs:ro" "$TLS_IMAGE"
          for attempt in $(seq 1 30); do
            if curl -fsS --cacert certs/server.pem https://localhost:8443/web/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::the TLS terminator in front of Odoo did not answer"
          docker logs tls 2>&1 | tail -40
          exit 1
      - name: run the purchasing server image against Odoo
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "PURCHASING_LIVE_MCP_TOKEN=$token" >> "$GITHUB_ENV"
          docker run -d --name purchasing --network host \
            -e PORT=8080 -e CHOREGOS_SERVER_TOKEN="$token" \
            -e PURCHASING_BACKEND=odoo -e PURCHASING_BASE_URL=https://localhost:8443 \
            -e PURCHASING_DATABASE="$ODOO_DATABASE" -e PURCHASING_USERNAME=purchasing-bot \
            -e PURCHASING_API_KEY="$PURCHASING_LIVE_INTEGRATION_KEY" \
            -e SSL_CERT_FILE=/certs/server.pem -v "$PWD/certs:/certs:ro" "$PURCHASING_IMAGE"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::the purchasing server did not answer /healthz"
          docker logs purchasing 2>&1 | tail -40
          exit 1
      - name: every operation of the profile, writes and compensations included
        env:
          PURCHASING_LIVE_MCP_URL: http://127.0.0.1:8080/mcp
          PURCHASING_LIVE_ODOO_URL: http://127.0.0.1:8069
          PURCHASING_LIVE_ODOO_DATABASE: ci
          PURCHASING_LIVE_ODOO_VERSION: ${{ matrix.odoo }}
          PURCHASING_LIVE_REGISTRY_SUPPORTED: ${{ matrix.registry }}
        run: uv run pytest tests/live/purchasing -q -m purchasing_live -rs
      - name: logs of the three containers
        if: always()
        run: |
          for name in purchasing tls; do echo "::group::$name"; docker logs "$name" 2>&1 | tail -150 || true; echo "::endgroup::"; done
          echo "::group::odoo"
          docker logs "$(docker ps -aq --filter label=purchasing-live=odoo)" 2>&1 | tail -250 || true
          echo "::endgroup::"

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --frozen
      - run: uv run pip list --format=json > deps.json
      # A CRITICAL blocks — that is what SECURITY.md promised, and `exit-code: 0` made
      # it false; and this job was not in the alert's `needs`.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  alerte:
    needs: [e2e, cluster, conformance, evals, replay, core-without-plugins, dependencies, live, purchasing-live]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // A nightly failure opens an issue: it does not get lost in the logs.
            const title = `nightly failed — ${new Date().toISOString().slice(0, 10)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "nightly",
            });
            const body = `The nightly CI failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["nightly", "needs-triage"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            }
