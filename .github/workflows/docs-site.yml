name: Documentation site

# The public documentation's source is `docs/site/`. It is published on graal.systems, beside the
# publisher's other products, never from here (ADR 0228, superseding the GitHub Pages publication of ADR 0185):
# the site's repository imports `docs/site/` at each release tag, with the connector pages, by its own
# robot. This workflow only proves the pages build: a pull request that touches them, and a push to
# main, build them with Docusaurus (`website/`), the generated connector pages included (ADR 0215).
# It publishes nothing and holds no Pages permission.

on:
  pull_request:
    paths:
      - "docs/site/**"
      - "website/**"
      - "packages/core/src/tranibor_core/procedures/**"
      - "tools/procedures/**"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "website/**"
      - "packages/core/src/tranibor_core/procedures/**"
      - "tools/procedures/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The plugins' setup procedures, read only: the public repository at main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: graalsystems/tranibor-agents
          ref: main
          path: .plugins-checkout
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with: { enable-cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Test the copy of the pages
        run: npm test
      - name: Copy docs/site, rewriting the links that leave it to GitHub
        env:
          REF: ${{ github.sha }}
        run: node scripts/import-docs.mjs --source .. --ref "$REF"
      # After the import, which empties website/docs/ first: the generated pages land beside the
      # hand-written connectors/index.md, never in docs/site/.
      # A pull request of this repository fails on a plugin procedure this parser refuses; a push to
      # main leaves that plugin out with a warning, so a plugin's change never turns main red here.
      - name: Write a page per setup procedure, the platform's and the plugins'
        env:
          LENIENT: ${{ github.event_name != 'pull_request' && '--plugins-lenient' || '' }}
        run: |
          PLUGINS_REF="$(git -C ../.plugins-checkout rev-parse HEAD)"
          uv run --frozen python ../tools/procedures/export_docs.py --site docs/connectors \
            --plugins ../.plugins-checkout/plugins --plugins-ref "$PLUGINS_REF" $LENIENT
      - name: Build
        run: npm run build
