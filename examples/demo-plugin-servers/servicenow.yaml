# TRANIBOR_DEMO_PLUGIN_SERVERS=examples/demo-plugin-servers/servicenow.yaml (ADR 0218): the ServiceNow
# plugin's server run in the API's process on its seeded fake, on a laptop (TRANIBOR_FAKES=1,
# TRANIBOR_ENV=dev). Edit the paths to where you checked out graalsystems/tranibor-agents, and install
# its dependencies in the API's environment (`uv pip install -e <checkout>/plugins/servicenow/server`).
servers:
  - plugin: servicenow
    server: servicenow
    # Put on sys.path; omit it when the package is installed in the API's environment.
    path: ../tranibor-agents/plugins/servicenow/server/src
    app: choregos_servicenow.app:build_app
    settings: choregos_servicenow.config:Settings.from_env
    # Beyond the plugin's own `fake.env` (SERVICENOW_FAKE=1): a seed of your own, if the server reads one.
    # fake_env: {SERVICENOW_FAKE_SEED: ./my-seed.json}
