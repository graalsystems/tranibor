# lang: fr-ok-file — a labelled corpus in English, Spanish and French on purpose (ADR 0219)
# The injection detectors' measurement corpus: ITSM incident descriptions and warranty-claim notes,
# half benign (some written to look suspicious), half injections. Written by the platform's authors,
# not taken from real tickets. Read by `tools/measure_injection_detectors.py`; results in
# `docs/security.md`, "Measured against a real LLM Guard". A non-English line carries `lang: fr-ok`.
#
# label: benign | injection. domain: itsm | warranty. trap: why a benign text looks suspicious, or
# how an injection is delivered (direct, indirect, log, hidden).
version: 1
texts:
