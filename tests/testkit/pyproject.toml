[project]
name = "tranibor-testkit"
version = "0.29.0"
description = "The test kit of the core's suites, shared with the first-party plugins' tests (ADR 0181, round D): fixtures and helpers, never shipped in an image"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "tranibor-api",
  "tranibor-orchestrator",
  "pytest>=8.3",
  "httpx>=0.27",
  "temporalio>=1.8",
  "alembic>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tranibor_testkit"]
