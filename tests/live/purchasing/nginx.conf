# A TLS terminator in front of the Odoo container, for the nightly job `purchasing-live` only. The purchasing
# server refuses a PURCHASING_BASE_URL that is not https (Settings._odoo_connection), and Odoo's own image
# speaks plain HTTP: the job trusts the certificate it makes for `localhost`, nothing else.
events {}
http {
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /certs/server.pem;
    ssl_certificate_key /certs/server.key;
    location / {
      proxy_pass http://127.0.0.1:8069;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }
  }
}
