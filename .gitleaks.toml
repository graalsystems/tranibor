# gitleaks : les règles par défaut, plus ce que ce dépôt contient VOLONTAIREMENT.
#
# Deux faux secrets vivent ici pour être détectés par la plateforme, pas par le scanner :
# le motif AWS que le test de la garantie `no_secrets` doit attraper, et une clé d'exemple
# dans un schéma de contrat. Les mettre en liste blanche par CHEMIN (et non par empreinte
# de commit) : une empreinte saute au premier commit qui retouche le fichier.
title = "choregos"

[extend]
useDefault = true

[allowlist]
description = "faux secrets de test et d'exemple, documentés"
paths = [
  '''packages/core/tests/test_gates\.py''',
  '''packages/contracts/schemas/examples/.*\.json''',
]
# Les historiques Temporal archivés portent l'URL de l'API interne des agents
# (`choregos-api:8000/api/v1/internal`), que la règle « generic-api-key » prend pour une
# clé. Les vrais secrets de ces historiques (clé de passerelle, jeton de run) sont
# caviardés à l'archivage — `tools/replay_record.py` — et c'est la RÈGLE ci-dessous qui le
# garde : un `sk-ant-` ou un JWT dans un historique reste un fuite.
regexTarget = "match"
regexes = [
  # RFC 8291, appendix A: the published Web Push test vector (the user agent's private key and
  # authentication secret), used by apps/api/tests/test_push.py to prove the encryption round-trip
  # (S81-03). Public by design.
  '''q1dXpw3UpT5VOmu_cf_v6ih07Aems3njxI-JWgLcM94''',
  '''BTBZMqHH6r4Tts7J_aSIgg''',
  '''choregos-api:8000/api/v1/internal''',
  # ADR 0091 (S40-26d) describes the relay's token in prose: "the run-token key, `aud=choregos-relay`".
  # The `generic-api-key` rule reads `key, ` followed by a quoted word as a key. The CI scans every
  # branch (`fetch-depth: 0`), so one such sentence on one branch turned the `secrets` job red on
  # main and on every open pull request (2026-10-27).
  '''run-token key, `aud=choregos-relay`''',
  # A work item's key (`work_item_key: "DESK-incident.42"`, a tracker's ticket id) is an identifier, not
  # a secret: `generic-api-key` reads `key: ` followed by a quoted word of enough entropy as a key. One
  # test on one branch turned the `secrets` job red on main and on every open pull request (2026-10-29).
  '''work_item_key: ["'][A-Za-z][A-Za-z0-9_-]*[-#][A-Za-z0-9_.#-]+["']''',
  # The tool bridge's tests (S57-07, #1363) use a fake run token shaped like a key, so that a test can
  # prove it never leaves the runner. `generic-api-key` reads it as a key; the CI scans the history, so
  # once merged it turned the `secrets` job red on every pull request (2026-11-05, #1382). This value only.
  '''rt-7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b''',
  # The rename to tranibor (ADR 0226 R6, branch of #2288) moves the internal API URL above to its new
  # service name: same URL, same reason.
  '''tranibor-api:8000/api/v1/internal''',
  # The chart's rename test (#2288) seeds a Secret of the former chart whose values are base64 of
  # `former-…` words (`Zm9ybWVy` = "former", `azE6Zm9ybWVy` = "k1:former"). Those prefixes only.
  '''(azE6)?Zm9ybWVy[A-Za-z0-9+/]*={0,2}''',
  # Azurite's well-known development account key, published by Microsoft in its documentation, used by
  # the object store conformance tests (#2281), and the base64 of `wrong-key` next to it. Public by
  # design. Each of these findings sat on an unmerged branch: the CI scans every branch
  # (`fetch-depth: 0`), so they turned the `secrets` job red on main and on every open pull request
  # (2026-11-25).
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''',
  '''d3Jvbmcta2V5''',
  # The owner sign-in test (apps/web/tests/owner-sign-in.test.tsx, branch ccr-1c818e13-bjmncf) uses a ticket
  # shaped like a JWT whose parts decode to {"alg":"EdDSA"}, {"aud":"choregos-owner"} and "signature": no key
  # signed it. The CI scans every branch (`fetch-depth: 0`), so it turned the `secrets` job red on main and on
  # every open pull request (2026-11-27). This value only.
  '''eyJhbGciOiJFZERTQSJ9\.eyJhdWQiOiJjaG9yZWdvcy1vd25lciJ9\.c2lnbmF0dXJl''',
  # Same branch: a test that proves a provider key never reaches the outpost door uses the made-up
  # `sk-proj-` + the alphabet and digits; and the SNI relay types a parameter `key: Ed25519PrivateKey`,
  # a type annotation the `generic-api-key` rule reads as a value. These two values only.
  '''sk-proj-abcdefghijklmnopqrstuvwxyz0123456789''',
  '''key: Ed25519PrivateKey\b''',
]
