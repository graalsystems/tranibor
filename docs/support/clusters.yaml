# Where the platform is proved (S87-04, plan 2026-11-25 D4): one entry per kind of cluster, and its last
# green proof. `make docs-support` writes the "Where the platform is proved" section of
# docs/deployment.md from this file; tests/docs/test_support_matrix.py refuses a page that differs.
#
# The word is COMPUTED, never written here (`tools/support_matrix.py`):
#   supported  the proof ran green in the last 30 days
#   tested     it ran green once (older, or its date was not recorded)
#   unknown    it never ran
# A provider the documentation calls "supported" needs an entry here that computes to `supported`.
#
# Seeded on 2026-11-25 with what the repository records, and nothing else: a proof is a dated status row,
# an ADR paragraph or a CI run, named in `evidence`. `date: null` means a green run is recorded without
# its date. `names` are what a page may call the provider (the scan of tests/docs/test_support_matrix.py).
# The day this record was last brought up to date: every word is computed against it, never against the
# day a test happens to run. Move it forward when you record a proof.
as_of: 2026-11-25
clusters:
  - id: operator-dev
    provider: The first operator's dev cluster (bare metal)
    names: []
    distribution: k3s 1.31
    runtime: gVisor (`gvisor` RuntimeClass)
    network_policy: Cilium 1.16
    executors: [agent_sandbox, k8s_job]
    proof:
      date: 2026-11-21
      version: 0.27.17
      what: real agent runs on both executors, the agent's own container under gVisor, the egress gate, the operator's suspension and resumption
      evidence:
        - docs/plan/status/S65.md
        - docs/adr/0146-the-runner-and-the-agent-do-not-share-a-container.md
