[project]
name = "tranibor-sni-relay"
version = "0.29.5"
description = "The relay a personal installation dials out to: it routes a phone's TLS by SNI and never terminates it (ADR 0230)"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # The relay's contract: its messages, its bounds, the metadata line's schema (`relay.yaml`).
    "tranibor-contracts",
    "pydantic>=2.9",
    "cryptography>=43.0",
    "PyJWT>=2.9",
    "jsonschema>=4.23",
    # The control channel's framing, driven without its server (Sans-I/O) on the relay's side.
    "websockets>=13.0",
    # The agent's pairing requests.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tranibor_sni_relay"]
