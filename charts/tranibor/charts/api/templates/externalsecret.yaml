{{- if and .Values.enabled .Values.global.externalSecrets.enabled }}
{{- /* S87-16: recent External Secrets Operator releases serve `v1` and stop serving `v1beta1`. The
     version the cluster serves, else `v1beta1` as before (an offline render, an older operator);
     `global.externalSecrets.apiVersion` decides when set. The fields below are the same in both. */}}
{{- $version := .Values.global.externalSecrets.apiVersion | default "" }}
{{- if not $version }}
{{- $version = ternary "external-secrets.io/v1" "external-secrets.io/v1beta1" (.Capabilities.APIVersions.Has "external-secrets.io/v1/ExternalSecret") }}
{{- end }}
{{- if not (has $version (list "external-secrets.io/v1" "external-secrets.io/v1beta1")) }}
{{- fail (printf "global.externalSecrets.apiVersion=%s: use external-secrets.io/v1 or external-secrets.io/v1beta1, or leave it empty to follow the cluster." $version) }}
{{- end }}
apiVersion: {{ $version }}
kind: ExternalSecret
metadata:
  name: {{ .Values.global.apiSecretRef }}
  labels: {{- include "tranibor.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.global.externalSecrets.refreshInterval }}
  secretStoreRef: { name: {{ .Values.global.externalSecrets.storeRef }}, kind: ClusterSecretStore }
  target: { name: {{ .Values.global.apiSecretRef }}, creationPolicy: Owner }
  data:
    {{- $keys := list "session-secret" "run-token-private-key" "run-token-public-key" "github-webhook-secret" "generic-webhook-secret" "github-app-id" "github-app-private-key" "github-app-client-id" "github-app-client-secret" }}
    {{- if .Values.global.secrets.keksInExternalSecret }}{{ $keys = append $keys (.Values.global.secrets.keksKey | default "secrets-keks") }}{{ end }}
    {{- if (.Values.externalSecrets | default dict).sessionSecretPrevious }}{{ $keys = append $keys "session-secret-previous" }}{{ end }}
    {{- range $key := $keys }}
    - secretKey: {{ $key }}
      remoteRef: { key: choregos/api, property: {{ $key }} }
    {{- end }}
{{- end }}
