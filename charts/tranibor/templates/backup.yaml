{{- /*
The scheduled backup of what the chart embeds (ADR 0184, S80-07b). One pod per run, its steps in
order as init containers, each writing into `/backup/<stamp>/`:

  prepare   draws the UTC stamp and creates the directory;
  database  `pg_dump -Fc --create` of every database of the embedded PostgreSQL, plus the roles
            without their passwords (`globals.sql`, for reference: a restore re-creates the roles
            from the chart's init scripts);
  files     an online SQLite copy of the embedded Temporal (`temporal.db`) in `dev` mode;
  memory    the embedded Ecphoria's own backup (`POST /api/v1/admin/backup`, its admin key), taken
            while it runs, then copied from its volume into `memory/ecphoria/` (S80-41, #2185);
  objects   a copy of the object store, when `backup.objectStore` is on;
  ship      (the main container) writes `MANIFEST` and `COMPLETE`, copies the directory to the S3
            target when there is one, and keeps the `keep` newest complete backups.

The embedded volumes are ReadWriteOnce: the backup pod mounts them beside their owner, which a
single node allows and a multi-node cluster does not guarantee. That is the profile it serves.

The embedded Temporal in `server` mode (ADR 0195) has no volume: its state is two databases
(`tranibor-temporal.database.name`, `.visibilityName`) on `global.database` (#2156). The backup
mounts no Temporal claim then, and the `files` step copies no Temporal. Those databases are in the
`database` step's `pg_dump` when they are on the embedded PostgreSQL (every database but the
templates and `postgres`); on the operator's PostgreSQL, or on another host
(`tranibor-temporal.database.host`), they are backed up by whoever runs that PostgreSQL.

The memory is never copied as files: Ecphoria's DuckDB files copied while it runs miss their WAL,
and the restored Ecphoria fell back to an empty in-memory store without an error (#2185). Ecphoria
exports its stores itself (DuckDB `EXPORT DATABASE`, its vector index, `VACUUM INTO` of its state)
under `/data/backups/<stamp>/` with a `manifest.json` of SHA-256 digests written last; the step
checks those digests on its copy. The restore puts that directory back on the volume and calls
`POST /api/v1/admin/restore`, which checks the digests again and swaps the stores in while Ecphoria
runs, then `POST /api/v1/admin/reindex` rebuilds its lexical index (`*.fts.sqlite`, derived).
*/ -}}
{{- if .Values.backup.enabled }}
{{- $g := .Values.global }}
{{- $b := .Values.backup }}
{{- $name := printf "%s-backup" .Release.Name }}
{{- $kind := $b.target.kind | default "volume" }}
{{- if not (has $kind (list "volume" "s3")) }}
{{- fail (printf "backup.target.kind=%s unknown: `volume` or `s3`." $kind) }}
{{- end }}
{{- if and (eq $kind "s3") (not $b.target.s3.url) }}
{{- fail "backup.target.kind=s3 needs backup.target.s3.url (s3://bucket/prefix): the backup would be written nowhere." }}
{{- end }}
{{- if and $b.objectStore (not $g.objectStore.secretRef) }}
{{- fail "backup.objectStore=true needs global.objectStore.secretRef: the backup reads the object store with the platform's own keys." }}
{{- end }}
{{- /* `server` mode keeps Temporal's state in PostgreSQL, never on a volume (ADR 0195, #2156). */ -}}
{{- $temporalServer := eq (toString ((index .Values "temporal" | default dict).mode | default "dev")) "server" }}
{{- $temporalFiles := and $g.temporal.embedded (not $temporalServer) }}
{{- if not (or $g.database.embedded $temporalFiles $g.memory.embedded $b.objectStore) }}
{{- fail "backup.enabled=true with nothing to back up: no embedded database, SQLite Temporal (`dev` mode) or memory, and backup.objectStore is off. An external dependency is backed up by whoever runs it, and a `server` mode Temporal lives in its PostgreSQL." }}
{{- end }}
{{- $pg := index .Values "postgresql" | default dict }}
{{- $pgImage := $b.images.postgres | default (printf "%s:%s" (($pg.image | default dict).repository | default "pgvector/pgvector") (($pg.image | default dict).tag | default "0.8.1-pg16")) }}
{{- $tools := include "tranibor.image" (dict "global" $g "image" (index .Values "api").image) }}
{{- $temporalVolume := and $temporalFiles (ne ((index .Values "temporal" | default dict).persistence | default dict).enabled false) }}
{{- $memoryVolume := and $g.memory.embedded (ne ((index .Values "ecphoria" | default dict).persistence | default dict).enabled false) }}
{{- /* The claims the owners mount, from the helpers their own templates call (#2153). */ -}}
{{- $temporalClaim := include "tranibor.temporalClaim" (dict "root" . "persistence" ((index .Values "temporal" | default dict).persistence)) }}
{{- $memoryClaim := include "tranibor.memoryClaim" (dict "root" . "persistence" ((index .Values "ecphoria" | default dict).persistence)) }}
{{- $env := list (dict "name" "HOME" "value" "/tmp") (dict "name" "RCLONE_CONFIG" "value" "/tmp/rclone.conf") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "tranibor.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
data:
  prepare.sh: |
    set -eu
    stamp=$(date -u +%Y%m%dT%H%M%SZ)
    mkdir -p "/backup/$stamp"
    echo "$stamp" > /backup/.current
    echo "backup $stamp started"
  database.sh: |
    set -eu
    dir="/backup/$(cat /backup/.current)/postgres"
    mkdir -p "$dir"
    # The database first answers: the NetworkPolicy controller admits a new pod to PostgreSQL a few
    # seconds after it starts (k3s's kube-router, about 3 s; until then the connection is refused),
    # and the first run of the proof failed there (S80-07d). Two minutes, then the step fails.
    for _ in $(seq 60); do pg_isready -q -t 2 && break; sleep 2; done
    pg_dumpall --globals-only --no-role-passwords > "$dir/globals.sql"
    for db in $(psql -d postgres -Atc "SELECT datname FROM pg_database WHERE NOT datistemplate AND datname <> 'postgres' ORDER BY 1"); do
      pg_dump -Fc --create -d "$db" -f "$dir/$db.dump"
      echo "database $db: $(wc -c < "$dir/$db.dump") bytes"
    done
  files.py: |
    import pathlib
    import sqlite3

    root = pathlib.Path("/backup") / pathlib.Path("/backup/.current").read_text().strip()


    def sqlite_copy(source: pathlib.Path, target: pathlib.Path) -> None:
        # The online backup API: a consistent copy while the owner keeps writing (WAL included).
        target.parent.mkdir(parents=True, exist_ok=True)
        with sqlite3.connect(source) as live, sqlite3.connect(target) as copy:
            live.backup(copy)
        print(f"{source} -> {target}: {target.stat().st_size} bytes")


    temporal = pathlib.Path("/temporal/temporal.db")
    if temporal.exists():
        sqlite_copy(temporal, root / "temporal" / "temporal.db")
  ecphoria_admin.py: |
    """What the `memory` steps of the backup and the restore share: Ecphoria's admin API, and the
    directory of one of its backups (#2185, S80-41)."""

    import hashlib
    import json
    import os
    import pathlib
    import time
    import urllib.error
    import urllib.request

    URL = os.environ["MEMORY_URL"].rstrip("/")
    TOKEN = os.environ["MEMORY_TOKEN"]
    #: Ecphoria's data directory (`ECPHORIA_STORAGE__DATA_DIR`), and where this pod mounts its volume.
    DATA = pathlib.PurePosixPath("/data")
    VOLUME = pathlib.Path("/memory")


    def call(path: str, body: dict | None = None) -> dict:
        """POST to Ecphoria's admin API with its admin key. A connection refused is tried again for
        two minutes (the NetworkPolicy controller admits a new pod a few seconds after it starts, and
        a restarted Ecphoria takes a moment to listen); an HTTP error fails the step at once, with
        what Ecphoria said."""
        request = urllib.request.Request(
            URL + path,
            data=json.dumps(body or {}).encode(),
            method="POST",
            headers={"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"},
        )
        for attempt in range(60):
            try:
                with urllib.request.urlopen(request, timeout=600) as response:
                    return json.loads(response.read() or b"{}")
            except urllib.error.HTTPError as error:
                raise SystemExit(f"{path}: Ecphoria answered {error.code}: {error.read()[:500]!r}") from None
            except urllib.error.URLError as error:
                if attempt == 59:
                    raise SystemExit(f"{path}: Ecphoria at {URL} does not answer: {error.reason}") from None
                time.sleep(2)
        raise AssertionError("unreachable")


    def on_the_volume(path: str) -> pathlib.Path:
        """The directory Ecphoria names, as this pod sees it on the same volume."""
        return VOLUME / pathlib.PurePosixPath(path).relative_to(DATA)


    def as_ecphoria_sees(path: pathlib.Path) -> str:
        return str(DATA / path.relative_to(VOLUME))


    def _digest(path: pathlib.Path) -> str:
        # Ecphoria's own digest (`sha256_path`): a file's bytes; a directory's files in path order,
        # each as its relative path, a NUL, then its bytes.
        digest = hashlib.sha256()
        if path.is_dir():
            for file in sorted((f for f in path.rglob("*") if f.is_file()), key=lambda f: f.parts):
                digest.update(str(file.relative_to(path)).encode())
                digest.update(b"\0")
                digest.update(file.read_bytes())
        else:
            digest.update(path.read_bytes())
        return digest.hexdigest()


    def verified(directory: pathlib.Path) -> dict:
        """The backup's manifest, once every artifact it names has the digest it records. Ecphoria
        writes the manifest last: a directory without one is a backup that did not finish."""
        manifest_path = directory / "manifest.json"
        if not manifest_path.is_file():
            raise SystemExit(f"{directory}: no manifest.json, not a complete Ecphoria backup")
        manifest = json.loads(manifest_path.read_text())
        if not manifest.get("artifacts"):
            raise SystemExit(f"{directory}: the manifest names no artifact")
        for artifact in manifest["artifacts"]:
            if _digest(directory / artifact["path"]) != artifact["sha256"]:
                raise SystemExit(f"{directory}: {artifact['path']} does not match its manifest")
        return manifest
  memory.py: |
    import json
    import pathlib
    import shutil

    from ecphoria_admin import call, on_the_volume, verified

    root = pathlib.Path("/backup") / pathlib.Path("/backup/.current").read_text().strip()
    # Ecphoria writes its backup on its own volume, taken while it runs: its stores exported, not
    # their files copied (#2185). The answer names the directory, in Ecphoria's own paths.
    answer = call("/api/v1/admin/backup")
    source = on_the_volume(str(answer["path"]))
    target = root / "memory" / "ecphoria"
    shutil.copytree(source, target)
    manifest = verified(target)
    print(f"memory: Ecphoria's backup {answer.get('timestamp')} copied, {len(manifest['artifacts'])} artifacts")
    print(f"memory: {json.dumps(manifest.get('counts', {}), sort_keys=True)}")
    # The copy is in the backup: the one on Ecphoria's volume would only take its room. Its own
    # retention (`backup.max_backups`) bounds what a failure to remove it leaves.
    try:
        shutil.rmtree(source)
    except OSError as error:
        print(f"memory: {source} left on Ecphoria's volume: {error}")
  objects.sh: |
    set -eu
    dir="/backup/$(cat /backup/.current)/objects"
    mkdir -p "$dir"
    rclone copy "objects:$OBJECTS_PATH" "$dir"
    echo "objects: $(find "$dir" -type f | wc -l) files"
  ship.sh: |
    set -eu
    stamp=$(cat /backup/.current)
    dir="/backup/$stamp"
    {
      echo "stamp: $stamp"
      echo "release: $RELEASE"
      echo "namespace: $NAMESPACE"
      echo "chart: $CHART"
      echo "files:"
      (cd "$dir" && find . -type f | sort | while read -r f; do echo "  - $f $(wc -c < "$f")"; done)
    } > "$dir/MANIFEST"
    touch "$dir/COMPLETE"
    if [ "$TARGET_KIND" = s3 ]; then
      rclone copy "$dir" "target:$TARGET_PATH/$stamp"
      root="target:$TARGET_PATH"
      # The local staging copy is an emptyDir: nothing to prune here.
    else
      root=/backup
    fi
    # Keep the $KEEP newest COMPLETE backups; a directory without COMPLETE that is older than this
    # one is a run that failed half-way, and is removed as well.
    kept=0
    for s in $(rclone lsf --dirs-only "$root" | sed 's#/$##' | grep -E '^[0-9]{8}T[0-9]{6}Z$' | sort -r); do
      if [ -n "$(rclone lsf "$root/$s" --include COMPLETE)" ]; then
        kept=$((kept + 1))
        if [ "$kept" -gt "$KEEP" ]; then
          echo "retention: removing $s"
          rclone purge "$root/$s"
        fi
      elif [ "$s" \< "$stamp" ]; then
        echo "retention: removing the incomplete $s"
        rclone purge "$root/$s"
      fi
    done
    echo "backup $stamp complete"
  fetch.sh: |
    set -eu
    if [ "$TARGET_KIND" = s3 ]; then root="target:$TARGET_PATH"; else root=/backup; fi
    stamp="${STAMP:-}"
    if [ -z "$stamp" ]; then
      for s in $(rclone lsf --dirs-only "$root" | sed 's#/$##' | grep -E '^[0-9]{8}T[0-9]{6}Z$' | sort -r); do
        if [ -n "$(rclone lsf "$root/$s" --include COMPLETE)" ]; then stamp="$s"; break; fi
      done
    fi
    if [ -z "$stamp" ] || [ -z "$(rclone lsf "$root/$stamp" --include COMPLETE)" ]; then
      echo "no complete backup ${stamp:-at all} under $root: nothing restored" >&2
      exit 1
    fi
    if [ "$TARGET_KIND" = s3 ]; then
      rclone copy "$root/$stamp" "/restore/$stamp"
      echo "/restore/$stamp" > /restore/.dir
    else
      echo "/backup/$stamp" > /restore/.dir
    fi
    echo "restoring $stamp"
    cat "$(cat /restore/.dir)/MANIFEST"
  restore-database.sh: |
    set -eu
    dir="$(cat /restore/.dir)/postgres"
    # The database first answers: the NetworkPolicy controller admits a new pod to PostgreSQL a few
    # seconds after it starts (k3s's kube-router, about 3 s; until then the connection is refused),
    # and the first run of the proof failed there (S80-07d). Two minutes, then the step fails.
    for _ in $(seq 60); do pg_isready -q -t 2 && break; sleep 2; done
    for dump in "$dir"/*.dump; do
      [ -e "$dump" ] || continue
      db=$(basename "$dump" .dump)
      psql -v ON_ERROR_STOP=1 -d postgres -c "DROP DATABASE IF EXISTS \"$db\" WITH (FORCE)"
      pg_restore --create --exit-on-error -d postgres "$dump"
      echo "database $db restored"
    done
  restore-files.py: |
    import pathlib
    import shutil

    root = pathlib.Path(pathlib.Path("/restore/.dir").read_text().strip())


    def replace(source: pathlib.Path, target: pathlib.Path) -> None:
        # A stale `-wal` or `-shm` beside a restored file would be replayed over it.
        for suffix in ("-wal", "-shm", "-journal"):
            pathlib.Path(str(target) + suffix).unlink(missing_ok=True)
        shutil.copy2(source, target)
        print(f"{source} -> {target}")


    temporal = root / "temporal" / "temporal.db"
    if temporal.exists() and pathlib.Path("/temporal").is_dir():
        replace(temporal, pathlib.Path("/temporal/temporal.db"))
  restore-memory.py: |
    import pathlib
    import shutil

    from ecphoria_admin import VOLUME, as_ecphoria_sees, call, verified

    root = pathlib.Path(pathlib.Path("/restore/.dir").read_text().strip())
    backup = root / "memory" / "ecphoria"
    if not backup.is_dir():
        if (root / "memory").is_dir():
            # A backup made before S80-41 holds Ecphoria's files copied while it ran: they may not
            # replay, and Ecphoria then runs empty without an error (#2185). Not put back blindly.
            raise SystemExit(
                "memory: this backup holds Ecphoria's files, not Ecphoria's own backup; they are not "
                "restored (docs/runbooks/single-node-restore.md, 'A backup whose memory is a copy of its files')"
            )
        print("memory: this backup holds no memory, Ecphoria is left as it is")
        raise SystemExit(0)
    manifest = verified(backup)
    stage = VOLUME / "restore" / root.name
    shutil.rmtree(stage, ignore_errors=True)
    shutil.copytree(backup, stage)
    # Ecphoria checks the digests again, then swaps each store in while it runs.
    print(f"memory: {call('/api/v1/admin/restore', {'path': as_ecphoria_sees(stage)})}")
    # Its lexical index is derived from the restored memories: rebuilt, not restored.
    print(f"memory: {call('/api/v1/admin/reindex')}")
    shutil.rmtree(stage, ignore_errors=True)
    print(f"memory: restored, {manifest.get('counts', {})}")
  restore-objects.sh: |
    set -eu
    dir="$(cat /restore/.dir)/objects"
    if [ -d "$dir" ]; then
      rclone copy "$dir" "objects:$OBJECTS_PATH"
      echo "objects restored"
    fi
{{- if and (eq $kind "volume") (not $b.target.volume.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels: {{- include "tranibor.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    # A `helm uninstall` must not take the backups with it.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $b.target.volume.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ $b.target.volume.size }} } }
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels: {{- include "tranibor.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ $b.schedule | quote }}
  # Two backups at once would write the same volumes' copies twice and race on the retention.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $b.activeDeadlineSeconds | int }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "tranibor.podName" (dict "root" $ "name" "backup") }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
        spec:
          enableServiceLinks: false
          restartPolicy: Never
          {{- include "tranibor.imagePullSecrets" $ | nindent 10 }}
          securityContext: {{- toYaml $g.podSecurityContext | nindent 12 }}
          initContainers:
            - name: prepare
              image: {{ $b.images.rclone }}
              command: ["sh", "/scripts/prepare.sh"]
              env: {{- toYaml $env | nindent 16 }}
              resources: {{- toYaml $b.resources | nindent 16 }}
              securityContext: {{- toYaml $g.securityContext | nindent 16 }}
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: backup, mountPath: /backup }
                - { name: tmp, mountPath: /tmp }
            {{- if $g.database.embedded }}
            - name: database
              image: {{ $pgImage }}
              command: ["sh", "/scripts/database.sh"]
              env:
                {{- toYaml $env | nindent 16 }}
                - { name: PGHOST, value: {{ printf "%s-postgresql" .Release.Name | quote }} }
                - { name: PGPORT, value: "5432" }
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: {{ printf "%s-postgresql" .Release.Name }}, key: username } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: {{ printf "%s-postgresql" .Release.Name }}, key: password } }
              resources: {{- toYaml $b.resources | nindent 16 }}
              securityContext: {{- toYaml $g.securityContext | nindent 16 }}
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: backup, mountPath: /backup }
                - { name: tmp, mountPath: /tmp }
            {{- end }}
            {{- if $temporalVolume }}
            - name: files
              image: {{ $tools }}
              command: ["python", "/scripts/files.py"]
              env: {{- toYaml $env | nindent 16 }}
              resources: {{- toYaml $b.resources | nindent 16 }}
              securityContext: {{- toYaml $g.securityContext | nindent 16 }}
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: backup, mountPath: /backup }
                - { name: tmp, mountPath: /tmp }
                # Read-write: SQLite's online backup takes a shared lock through the `-shm` file.
                - { name: temporal, mountPath: /temporal }
            {{- end }}
            {{- if $memoryVolume }}
            - name: memory
              image: {{ $tools }}
              command: ["python", "/scripts/memory.py"]
              env: {{- include "tranibor.backupMemoryEnv" (dict "root" $ "env" $env) | nindent 16 }}
              resources: {{- toYaml $b.resources | nindent 16 }}
              securityContext: {{- toYaml $g.securityContext | nindent 16 }}
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: backup, mountPath: /backup }
                - { name: tmp, mountPath: /tmp }
                # Ecphoria writes its backup there and stays the only writer of its stores; read-write
                # only to remove that backup once it is copied.
                - { name: memory, mountPath: /memory }
            {{- end }}
            {{- if $b.objectStore }}
            - name: objects
              image: {{ $b.images.rclone }}
              command: ["sh", "/scripts/objects.sh"]
              env:
                {{- toYaml $env | nindent 16 }}
                {{- include "tranibor.backupRemote" (dict "remote" "OBJECTS" "endpoint" (include "tranibor.objectStoreEndpoint" $) "region" $g.objectStore.region "secretRef" $g.objectStore.secretRef) | nindent 16 }}
                - { name: OBJECTS_PATH, value: {{ trimPrefix "s3://" $g.objectStore.url | quote }} }
              resources: {{- toYaml $b.resources | nindent 16 }}
              securityContext: {{- toYaml $g.securityContext | nindent 16 }}
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: backup, mountPath: /backup }
                - { name: tmp, mountPath: /tmp }
            {{- end }}
          containers:
            - name: ship
              image: {{ $b.images.rclone }}
              command: ["sh", "/scripts/ship.sh"]
              env:
                {{- toYaml $env | nindent 16 }}
                - { name: RELEASE, value: {{ .Release.Name | quote }} }
                - { name: NAMESPACE, value: {{ .Release.Namespace | quote }} }
                - { name: CHART, value: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }} }
                - { name: KEEP, value: {{ $b.keep | int | quote }} }
                - { name: TARGET_KIND, value: {{ $kind | quote }} }
                {{- if eq $kind "s3" }}
                - { name: TARGET_PATH, value: {{ trimPrefix "s3://" $b.target.s3.url | quote }} }
                {{- include "tranibor.backupRemote" (dict "remote" "TARGET" "endpoint" $b.target.s3.endpoint "region" $b.target.s3.region "secretRef" $b.target.s3.secretRef) | nindent 16 }}
                {{- end }}
              resources: {{- toYaml $b.resources | nindent 16 }}
              securityContext: {{- toYaml $g.securityContext | nindent 16 }}
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: backup, mountPath: /backup }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: scripts
              configMap: { name: {{ $name }} }
            - name: tmp
              emptyDir: {}
            - name: backup
              {{- if eq $kind "volume" }}
              persistentVolumeClaim: { claimName: {{ $b.target.volume.existingClaim | default $name }} }
              {{- else }}
              emptyDir: {}
              {{- end }}
            {{- if $temporalVolume }}
            - name: temporal
              persistentVolumeClaim: { claimName: {{ $temporalClaim }} }
            {{- end }}
            {{- if $memoryVolume }}
            - name: memory
              persistentVolumeClaim: { claimName: {{ $memoryClaim }} }
            {{- end }}
---
# The restore, as a job to start by hand and never on a schedule (`suspend: true`):
#   kubectl create job --from=cronjob/{{ printf "%s-restore" .Release.Name }} restore-1
# with every writer stopped first. `tools/single-node/restore.sh` does both, and
# `docs/runbooks/single-node-restore.md` says when. It restores the newest complete backup, or the
# one named by the key `stamp` of the optional ConfigMap `{{ printf "%s-restore" .Release.Name }}`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-restore" .Release.Name }}
  labels: {{- include "tranibor.labels" . | nindent 4 }}
    app.kubernetes.io/component: restore
spec:
  # February 31st: never. The job is only ever created from this template.
  schedule: "0 0 31 2 *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ $b.activeDeadlineSeconds | int }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "tranibor.podName" (dict "root" $ "name" "restore") }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: restore
        spec:
          enableServiceLinks: false
          restartPolicy: Never
          {{- include "tranibor.imagePullSecrets" $ | nindent 10 }}
          securityContext: {{- toYaml $g.podSecurityContext | nindent 12 }}
          initContainers:
            - name: fetch
              image: {{ $b.images.rclone }}
              command: ["sh", "/scripts/fetch.sh"]
              env:
                {{- toYaml $env | nindent 16 }}
                - { name: TARGET_KIND, value: {{ $kind | quote }} }
                - name: STAMP
                  valueFrom: { configMapKeyRef: { name: {{ printf "%s-restore" .Release.Name }}, key: stamp, optional: true } }
                {{- if eq $kind "s3" }}
                - { name: TARGET_PATH, value: {{ trimPrefix "s3://" $b.target.s3.url | quote }} }
                {{- include "tranibor.backupRemote" (dict "remote" "TARGET" "endpoint" $b.target.s3.endpoint "region" $b.target.s3.region "secretRef" $b.target.s3.secretRef) | nindent 16 }}
                {{- end }}
              resources: {{- toYaml $b.resources | nindent 16 }}
              securityContext: {{- toYaml $g.securityContext | nindent 16 }}
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: restore, mountPath: /restore }
                - { name: tmp, mountPath: /tmp }
                {{- if eq $kind "volume" }}
                - { name: backup, mountPath: /backup, readOnly: true }
                {{- end }}
            {{- if $g.database.embedded }}
            - name: database
              image: {{ $pgImage }}
              command: ["sh", "/scripts/restore-database.sh"]
              env:
                {{- toYaml $env | nindent 16 }}
                - { name: PGHOST, value: {{ printf "%s-postgresql" .Release.Name | quote }} }
                - { name: PGPORT, value: "5432" }
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: {{ printf "%s-postgresql" .Release.Name }}, key: username } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: {{ printf "%s-postgresql" .Release.Name }}, key: password } }
              resources: {{- toYaml $b.resources | nindent 16 }}
              securityContext: {{- toYaml $g.securityContext | nindent 16 }}
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: restore, mountPath: /restore }
                - { name: tmp, mountPath: /tmp }
                {{- if eq $kind "volume" }}
                - { name: backup, mountPath: /backup, readOnly: true }
                {{- end }}
            {{- end }}
            {{- if $temporalVolume }}
            - name: files
              image: {{ $tools }}
              command: ["python", "/scripts/restore-files.py"]
              env: {{- toYaml $env | nindent 16 }}
              resources: {{- toYaml $b.resources | nindent 16 }}
              securityContext: {{- toYaml $g.securityContext | nindent 16 }}
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: restore, mountPath: /restore }
                - { name: tmp, mountPath: /tmp }
                {{- if eq $kind "volume" }}
                - { name: backup, mountPath: /backup, readOnly: true }
                {{- end }}
                - { name: temporal, mountPath: /temporal }
            {{- end }}
            {{- if $memoryVolume }}
            # Ecphoria runs during this step (`tools/single-node/restore.sh` leaves it up): its own
            # restore swaps its stores in, and nothing else writes to them meanwhile.
            - name: memory
              image: {{ $tools }}
              command: ["python", "/scripts/restore-memory.py"]
              env: {{- include "tranibor.backupMemoryEnv" (dict "root" $ "env" $env) | nindent 16 }}
              resources: {{- toYaml $b.resources | nindent 16 }}
              securityContext: {{- toYaml $g.securityContext | nindent 16 }}
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: restore, mountPath: /restore }
                - { name: tmp, mountPath: /tmp }
                {{- if eq $kind "volume" }}
                - { name: backup, mountPath: /backup, readOnly: true }
                {{- end }}
                # The backup is staged on Ecphoria's volume: `/admin/restore` reads a directory of its own.
                - { name: memory, mountPath: /memory }
            {{- end }}
            {{- if $b.objectStore }}
            - name: objects
              image: {{ $b.images.rclone }}
              command: ["sh", "/scripts/restore-objects.sh"]
              env:
                {{- toYaml $env | nindent 16 }}
                {{- include "tranibor.backupRemote" (dict "remote" "OBJECTS" "endpoint" (include "tranibor.objectStoreEndpoint" $) "region" $g.objectStore.region "secretRef" $g.objectStore.secretRef) | nindent 16 }}
                - { name: OBJECTS_PATH, value: {{ trimPrefix "s3://" $g.objectStore.url | quote }} }
              resources: {{- toYaml $b.resources | nindent 16 }}
              securityContext: {{- toYaml $g.securityContext | nindent 16 }}
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: restore, mountPath: /restore }
                - { name: tmp, mountPath: /tmp }
                {{- if eq $kind "volume" }}
                - { name: backup, mountPath: /backup, readOnly: true }
                {{- end }}
            {{- end }}
          containers:
            - name: done
              image: {{ $b.images.rclone }}
              command: ["sh", "-c", "echo \"restored from $(cat /restore/.dir)\""]
              env: {{- toYaml $env | nindent 16 }}
              resources: {{- toYaml $b.resources | nindent 16 }}
              securityContext: {{- toYaml $g.securityContext | nindent 16 }}
              volumeMounts:
                - { name: restore, mountPath: /restore }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: scripts
              configMap: { name: {{ $name }} }
            - name: tmp
              emptyDir: {}
            - name: restore
              emptyDir: {}
            {{- if eq $kind "volume" }}
            - name: backup
              persistentVolumeClaim: { claimName: {{ $b.target.volume.existingClaim | default $name }} }
            {{- end }}
            {{- if $temporalVolume }}
            - name: temporal
              persistentVolumeClaim: { claimName: {{ $temporalClaim }} }
            {{- end }}
            {{- if $memoryVolume }}
            - name: memory
              persistentVolumeClaim: { claimName: {{ $memoryClaim }} }
            {{- end }}
{{- end }}
