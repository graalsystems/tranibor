{{- $e := .Values.global.egress | default dict }}
{{- if $e.enabled }}
{{- /*
`tranibor-egress` (ADR 0070): the per-run egress proxy, in the release namespace, from the API image.
A runner presents its run id and token as proxy credentials; the proxy asks the API (`GET
/internal/runs/{id}/network`) what THAT run may reach, and lets a tunnel through or refuses. It holds
no database access and no service account token; its one secret is its own report key (ADR 0145),
the `egress-report-key` of the API's secret, which no run's pod receives.

What it enforces: host, port and CONNECTION rate. What it cannot see: anything inside TLS (method,
path, headers, User-Agent). It is a wall only where the network forces traffic through it: the chart's
NetworkPolicies do (`networkPolicies.enabled`); on a platform that owns egress (Cilium FQDN rules) the
platform must stop letting runner pods out directly.
*/ -}}
{{- $api := index .Values "api" | default dict }}
{{- $apiUrl := printf "%s/api/v1" (.Values.global.internalApiUrl | default "http://tranibor-api:8000") }}
{{- $port := int ($e.port | default 3128) }}
{{- $health := int ($e.healthPort | default 8081) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tranibor-egress
  labels:
    app.kubernetes.io/name: {{ include "tranibor.podName" (dict "root" $ "name" "egress") }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: egress
    app.kubernetes.io/part-of: {{ include "tranibor.labelPrefix" $ }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ $e.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: egress
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tranibor.podName" (dict "root" $ "name" "egress") }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: egress
        # NOT `part-of: choregos`: `tranibor-allow-ingress` admits every pod of the namespace to the pods
        # that carry it, and NetworkPolicies add up. The proxy takes traffic from runner pods only.
      annotations:
        checksum/config: {{ toJson $e | sha256sum }}
    spec:
      enableServiceLinks: false
      # No service account token: the proxy talks to the API with the run's own token, and reports with
      # its key on top of it (ADR 0145).
      automountServiceAccountToken: false
      {{- include "tranibor.imagePullSecrets" $ | nindent 6 }}
      securityContext: {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: egress
          image: {{ include "tranibor.image" (dict "global" .Values.global "image" ($api.image | default dict)) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "tranibor_api.egress"]
          securityContext: {{- toYaml .Values.global.securityContext | nindent 12 }}
          ports:
            - { name: proxy, containerPort: {{ $port }} }
            - { name: health, containerPort: {{ $health }} }
          env:
            - { name: TRANIBOR_EGRESS_API_URL, value: {{ $apiUrl | quote }} }
            - { name: TRANIBOR_EGRESS_PORT, value: {{ $port | quote }} }
            - { name: TRANIBOR_EGRESS_HEALTH_PORT, value: {{ $health | quote }} }
            - { name: TRANIBOR_EGRESS_PORTS, value: {{ toJson ($e.ports | default (list 443 80)) | quote }} }
            - { name: TRANIBOR_EGRESS_DENY_DOMAINS, value: {{ toJson ($e.denyDomains | default list) | quote }} }
            - { name: TRANIBOR_EGRESS_CACHE_SECONDS, value: {{ $e.cacheSeconds | default 60 | quote }} }
            # The proxy's own key, sent with its reports (ADR 0145): the API's copy, never a run's.
            - name: TRANIBOR_EGRESS_REPORT_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: egress-report-key, optional: true } }
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml ($e.resources | default dict) | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- /* `tranibor-egress`, and the former `choregos-egress` on the same pods until 0.32.0 (ADR 0226, R9b): a run
   started before the upgrade, or a suspended sandbox, was given the former address and goes out through it
   until it ends, and the default `runner.egressProxy` names it for the window. */}}
{{- range $service := list "tranibor-egress" "choregos-egress" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service }}
  labels:
    app.kubernetes.io/name: {{ include "tranibor.podName" (dict "root" $ "name" "egress") }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: egress
    app.kubernetes.io/part-of: {{ include "tranibor.labelPrefix" $ }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  type: ClusterIP
  ports:
    - { name: proxy, port: {{ $port }}, targetPort: proxy }
  selector:
    app.kubernetes.io/component: egress
    app.kubernetes.io/instance: {{ $.Release.Name }}
{{- end }}
{{- end }}
