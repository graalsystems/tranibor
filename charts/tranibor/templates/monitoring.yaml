{{- /*
Two observability flavours, because "rendering a ServiceMonitor" is not "being scraped".

On 2026-09-26, an operator's dev tenant had been running for an hour with a ServiceMonitor and
a PrometheusRule present in its namespace — and not one series collected, not one alert
evaluated: the platform runs on VictoriaMetrics, whose operator does not look at the
`monitoring.coreos.com` types. An inert object says nothing, and that is worse than a missing object: it gives
the feeling of being monitored.

`monitoring.flavour` decides. The PromQL rules are written ONCE and served to both.

On the VictoriaMetrics side: ONE `VMRule` only. Two in the same vmalert scope make
the operator loop, which the platform operator has already paid for once.

Each object is rendered only when the cluster serves its type (S87-16): on a cluster without the
operator, a ServiceMonitor or a PrometheusRule fails the whole install with `no matches for kind`.
Argo CD and `helm install` hand the cluster's API versions over; an offline render that targets a
cluster with the operator sets `monitoring.skipCrdCheck: true` (`tranibor.monitoringServed`).
*/ -}}
{{- $saveur := .Values.monitoring.flavour | default "prometheus" }}
{{- if not (has $saveur (list "prometheus" "victoriametrics")) }}
{{- fail (printf "monitoring.flavour=%s is unknown: use `prometheus` or `victoriametrics`." $saveur) }}
{{- end }}
{{- $vm := eq $saveur "victoriametrics" }}
{{- if and .Values.monitoring.serviceMonitor (include "tranibor.monitoringServed" (dict "root" . "kind" "scrape")) }}
apiVersion: {{ if $vm }}operator.victoriametrics.com/v1beta1{{ else }}monitoring.coreos.com/v1{{ end }}
kind: {{ if $vm }}VMServiceScrape{{ else }}ServiceMonitor{{ end }}
metadata:
  name: tranibor
  labels: {{- include "tranibor.labels" . | nindent 4 }}
spec:
  # The API alone: it computes the series from the database (`metriques.py`). The
  # front end, scraped too before, answered 404 every thirty seconds.
  # Either value of `part-of` (ADR 0226, R9b: `global.labelValues`); the former Service `choregos-api` has
  # no `component` and is not scraped a second time.
  selector:
    matchLabels:
      app.kubernetes.io/component: api
    matchExpressions:
      - { key: app.kubernetes.io/part-of, operator: In, values: [tranibor, choregos] }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
{{- if and .Values.monitoring.alerts (include "tranibor.monitoringServed" (dict "root" . "kind" "rules")) }}
---
apiVersion: {{ if $vm }}operator.victoriametrics.com/v1beta1{{ else }}monitoring.coreos.com/v1{{ end }}
kind: {{ if $vm }}VMRule{{ else }}PrometheusRule{{ end }}
metadata:
  name: tranibor
  labels: {{- include "tranibor.labels" . | nindent 4 }}
spec:
  groups:
    # The group keeps its name for now (ADR 0226, R9b): Prometheus's own series about its rules
    # (`prometheus_rule_group_*`, label `rule_group`) and Grafana's alert views key on it, and two groups
    # of the same rules would fire every alert twice. The alerts keep theirs (`tranibor.alertRules`).
    - name: choregos.platform
      rules:
{{ include "tranibor.alertRules" . | indent 8 }}
{{- if include "tranibor.outpostsEnabled" . }}
{{ include "tranibor.outpostsAlertRules" . | indent 8 }}
{{- end }}
{{- if (.Values.global.auditExport | default dict).enabled }}
{{ include "tranibor.auditExportAlertRules" . | indent 8 }}
{{- end }}
{{- end }}
