image:
  # Published by graalsystems/ecphoria since 0.2.6 (`-memory` is the memory edition). The tag is the
  # one `compose.yaml` runs: `tests/charts/test_ecphoria_image.py` keeps the chart on it.
  repository: ghcr.io/graalsystems/ecphoria
  tag: "0.2.6-memory"
# Adopt a Deployment that already runs (#2150). Empty: `<release>-ecphoria`. The volume keeps its own name
# (`persistence.existingClaim`), and the Service its own (`global.memory.serviceName`).
deploymentName: ""
# The labels the pods carry and the selector and Service match. Empty: `app.kubernetes.io/name:
# choregos-ecphoria` and `app.kubernetes.io/instance: <release>`. Set, this map REPLACES them whole (a site's
# network policy selects on them; a Deployment's selector is immutable, so it must equal the live one).
# The chart's own NetworkPolicies follow its `app.kubernetes.io/name`.
selectorLabels: {}
# Extra labels on the pods only (never in a selector).
podLabels: {}
persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  # Adopt a volume that already holds the data: the chart renders no claim of its own and never touches it.
  existingClaim: ""
# Embedding model, requested from Choregos' gateway (measured cost, no direct egress).
embedding:
  # `none` when the deployment has no gateway: memory keeps the facts, but
  # semantic search falls back to lexical. Better to say so than to let
  # embedding calls fail silently on every write.
  provider: openai_compatible
  model: platform/embed
  # Vector size the model returns (`openai/text-embedding-3-small`, the `platform/embed` alias: 1536).
  # Ecphoria's default is 768: with no value here every write answered "embedding dimension
  # mismatch: expected 768, got 1536" and no memory was ever indexed (prod, 2026-11-18). Change it
  # WITH the model, then re-embed (`POST /admin/memory/reembed`).
  dimension: 1536
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 2Gi }
