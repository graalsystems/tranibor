{{- /*
The relay's identity in this cluster: none that opens anything. The account is bound to no Role (this
chart renders no Role, no ClusterRole and no binding), and its token is mounted in no pod: the relay
asks nothing of the cluster it runs in.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "choregos-relay.fullname" . }}
  labels: {{- include "choregos-relay.labels" . | nindent 4 }}
automountServiceAccountToken: false
