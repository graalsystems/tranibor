apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: choregos-pod-security
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    # STRICT rule. Before 2026-09-25, every field was a conditional anchor
    # (`=(runAsNonRoot): true`): a pod that set no securityContext passed, and that is exactly
    # the pod we want to stop. Now the context is required, for the pod and for every
    # container, with a seccomp profile. `tests/charts` renders the chart and checks that each
    # of our pods satisfies it.
    - name: non-root
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["tranibor", "tranibor-*", "choregos", "choregos-*", "proj-*"]
      validate:
        message: >-
          Tranibor containers run as non-root, without privilege escalation, under
          seccomp RuntimeDefault: securityContext.runAsNonRoot, seccompProfile and
          allowPrivilegeEscalation: false are mandatory
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: "RuntimeDefault | Localhost"
              =(appArmorProfile):
                type: "RuntimeDefault | Localhost"
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  =(privileged): false
                  capabilities:
                    drop:
                      - ALL
                  # A container's own profile overrides the pod's: `Unconfined` on a container
                  # would pass a rule that only reads the pod level (finding #784).
                  =(seccompProfile):
                    type: "RuntimeDefault | Localhost"
                  =(appArmorProfile):
                    type: "RuntimeDefault | Localhost"
            # Same container-level rules for init containers (native sidecars included);
            # optional anchor so a pod without any still passes.
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
                  =(privileged): false
                  capabilities:
                    drop:
                      - ALL
                  # A container's own profile overrides the pod's: `Unconfined` on a container
                  # would pass a rule that only reads the pod level (finding #784).
                  =(seccompProfile):
                    type: "RuntimeDefault | Localhost"
                  =(appArmorProfile):
                    type: "RuntimeDefault | Localhost"
            # Ephemeral containers (kubectl debug) carry their own profiles too.
            =(ephemeralContainers):
              - =(securityContext):
                  =(seccompProfile):
                    type: "RuntimeDefault | Localhost"
                  =(appArmorProfile):
                    type: "RuntimeDefault | Localhost"
    - name: no-hostpath
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["tranibor", "tranibor-*", "choregos", "choregos-*", "proj-*"]
      validate:
        message: "hostPath is forbidden: a runner never touches the node"
        pattern:
          spec:
            =(volumes):
              - X(hostPath): "null"
    - name: required-labels
      match:
        any:
          - resources:
              # PipelineRun is Tekton's, an optional executor: its rule is in `tekton/`, since
              # Kyverno refuses the whole policy on a cluster without that kind.
              kinds: [Pod, Job]
              namespaces: ["proj-*"]
      validate:
        message: "every object of a project namespace carries the `tranibor/project` label (or, until the end of ADR 0226's window, `choregos/project`)"
        # Either name of the label for the window of ADR 0226: the platform writes `choregos/project` until
        # R7 moves it to `tranibor/project`, and an object written before keeps the former one.
        anyPattern:
          - metadata:
              labels:
                tranibor/project: "?*"
          - metadata:
              labels:
                choregos/project: "?*"
