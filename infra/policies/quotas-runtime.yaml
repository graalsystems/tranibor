apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: choregos-quotas-and-runtime
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: quota-present
      match:
        any:
          - resources:
              kinds: [Namespace]
              names: ["proj-*"]
      validate:
        message: "a project namespace must have a ResourceQuota (generated by provisioning)"
        deny:
          conditions:
            all:
              # Either name of the label (ADR 0224): a namespace provisioned before the upgrade has the former.
              - key: "{{ request.object.metadata.labels.\"tranibor/project\" || request.object.metadata.labels.\"choregos/project\" || '' }}"
                operator: Equals
                value: ""
    # gVisor is enforced per project by the `require-gvisor` Policy that provisioning writes
    # (gitops.render_project_manifests). A cluster-wide rule here keyed on a pod label that
    # nothing sets never applied to anything (finding #790).
